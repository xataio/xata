{{- $app := lookup "v1" "Secret" .Release.Namespace "xata-metastore-app" | default dict }}
{{- $appData := get $app "data" | default dict }}
{{- $password := .Values.credentials.password | default (get $appData "password" | default "" | b64dec) | default (randAlphaNum 40) }}
{{- $username := .Values.credentials.username }}
{{- if not .Values.credentials.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: xata-metastore-app
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/basic-auth
stringData:
  username: {{ $username | quote }}
  password: {{ $password | quote }}
{{- else if ne .Values.credentials.existingSecret "xata-metastore-app" }}
{{- fail "credentials.existingSecret must be xata-metastore-app (keys username,password); see README" }}
{{- end }}
{{- range $name, $keys := dict "auth-api-key-hmac" (dict "hmac-secret" $.Values.credentials.hmacSecret) "keycloak-realm-secret" (dict "XATA_CLI_CLIENT_SECRET" $.Values.credentials.cliClientSecret) "xata-metastore-superuser" (dict "username" "postgres" "password" "") }}
{{- $secret := lookup "v1" "Secret" $.Release.Namespace $name | default dict }}
{{- $data := get $secret "data" | default dict }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
{{- range $key, $value := $keys }}
  {{ $key }}: {{ $value | default (get $data $key | default "" | b64dec) | default (randAlphaNum 40) | quote }}
{{- end }}
{{- end }}
