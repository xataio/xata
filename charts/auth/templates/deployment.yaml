apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Chart.Name }}
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      annotations:
        checksum/chart-values: {{ toJson .Values | sha256sum }}
        {{- if (dig "rolloutOnUpgrade" false (.Values.global | default dict)) }}
        xata.io/helm-revision: {{ .Release.Revision | quote }}
        {{- end }}
      labels:
        app: {{ .Chart.Name }}
    spec:
      enableServiceLinks: false
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.setupJob.enabled }}
      serviceAccountName: {{ .Chart.Name }}-setup-wait
      {{- end }}
      initContainers:
        {{- if .Values.setupJob.enabled }}
        - name: wait-for-setup
          image: {{ .Values.setupJob.waitImage }}
          command: [kubectl]
          args: ["-n", {{ .Release.Namespace | quote }}, wait, "job/{{ .Chart.Name }}-setup-{{ .Release.Revision }}", "--for=condition=complete", "--timeout=900s"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
        {{- else }}
        {{- include "auth.setupContainer" . | nindent 8 }}
        {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http-port
              containerPort: {{ .Values.service.httpPort }}
              protocol: TCP
            - name: grpc-port
              containerPort: {{ .Values.service.grpcPort }}
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          env:
            - name: AUTH_GRPC_URL
              value: "{{ .Values.dependencies.authGrpcUrl }}"
            - name: PROJECTS_GRPC_URL
              value: "{{ .Values.dependencies.projectsGrpcUrl }}"
            - name: POSTGRES_SSLMODE
              value: {{ .Values.postgres.sslmode }}
            - name: FRONTEND_URL
              value: {{ .Values.config.frontendURL | quote }}
            - name: BILLING_REQUIRED
              value: {{ .Values.config.billingRequired | quote }}
            - name: KEYCLOAK_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: auth-keycloak-initial-admin
                  key: username
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-keycloak-initial-admin
                  key: password
            - name: OTEL_SERVICE_NAME
              value: "{{ .Values.observability.serviceName }}"
            - name: API_KEY_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-api-key-hmac
                  key: hmac-secret
            - name: ORB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: orb-secret
                  key: api-key
                  optional: {{ not .Values.hostedIntegrations.required }}
            - name: STRIPE_API_KEY
              valueFrom:
                  secretKeyRef:
                    name: stripe-secret
                    key: api-key
                    optional: {{ not .Values.hostedIntegrations.required }}
            - name: ORB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: orb-secret
                  key: orb-webhook-secret
                  optional: {{ not .Values.hostedIntegrations.required }}
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: stripe-secret
                  key: stripe-webhook-secret
                  optional: {{ not .Values.hostedIntegrations.required }}
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: slack-secret
                  key: bot-token
                  optional: {{ not .Values.hostedIntegrations.required }}
            - name: CUSTOMER_IO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: customerio
                  key: CUSTOMER_IO_API_KEY
                  optional: true
            - name: CUSTOMER_IO_IS_PRODUCTION
              valueFrom:
                configMapKeyRef:
                  name: customerio-config
                  key: CUSTOMER_IO_IS_PRODUCTION
                  optional: true
            - name: TACKLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: tackle-secret
                  key: client-id
                  optional: {{ not .Values.hostedIntegrations.required }}
            - name: TACKLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tackle-secret
                  key: client-secret
                  optional: {{ not .Values.hostedIntegrations.required }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            - secretRef:
                name: auth-api-key-hmac
            - configMapRef:
                name: keycloak-api-settings
            - configMapRef:
                name: otel-config
            - configMapRef:
                name: slack-config
                optional: {{ not .Values.hostedIntegrations.required }}
            - secretRef:
                name: auth-keycloak-initial-admin
            - secretRef:
                name: orb-secret
                optional: {{ not .Values.hostedIntegrations.required }}
            - secretRef:
                name: posthog
                optional: {{ not .Values.hostedIntegrations.required }}
          readinessProbe:
            httpGet:
              path: /_hello
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /_hello
              port: 5001
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
