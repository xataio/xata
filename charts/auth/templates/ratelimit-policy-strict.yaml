# Stricter rate limits for auth endpoints.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: auth-endpoints-strict-ratelimit
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ .Chart.Name }}
  rateLimit:
    type: Local
    local:
      rules:
        # Strict limit for /user endpoints: 500 requests per hour
        - clientSelectors:
            - headers:
                - name: ":path"
                  type: RegularExpression
                  value: "^/user.*"
          limit:
            requests: 500
            unit: Hour
        # Strict limit for /api-keys endpoints: 500 requests per hour
        - clientSelectors:
            - headers:
                - name: ":path"
                  type: RegularExpression
                  value: "^/api-keys.*"
          limit:
            requests: 500
            unit: Hour
        # Very strict limit for organization invitations: 100 requests per hour
        - clientSelectors:
            - headers:
                - name: ":path"
                  type: RegularExpression
                  value: "^/organizations/[^/]+/invitations.*"
          limit:
            requests: 100
            unit: Hour
        # Strict limit for organization members: 200 requests per hour
        - clientSelectors:
            - headers:
                - name: ":path"
                  type: RegularExpression
                  value: "^/organizations/[^/]+/members.*"
          limit:
            requests: 200
            unit: Hour
