apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app: gateway
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      annotations:
        checksum/chart-values: {{ toJson .Values | sha256sum }}
        {{- if (dig "rolloutOnUpgrade" false (.Values.global | default dict)) }}
        xata.io/helm-revision: {{ .Release.Revision | quote }}
        {{- end }}
      labels:
        app: gateway
    spec:
      serviceAccountName: gateway
      enableServiceLinks: false
      # Must exceed drainingTime so the gateway can close the connections that
      # are still open when the draining period ends, before kubelet sends
      # SIGKILL.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.service.targetPort }}
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          ports:
            - name: wire-port
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
            {{- if .Values.http.enabled }}
            - name: http-port
              containerPort: {{ .Values.service.httpTargetPort }}
              protocol: TCP
            {{- end }}
          volumeMounts:
            - name: tls-cert
              mountPath: {{ .Values.secret.mountPath }}
              readOnly: true
          env:
            - name: XATA_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: GOMAXPROCS
              value: {{ .Values.gomaxprocs | default "8" | quote }}
            - name: XATA_SQL_GW_LISTEN_ADDRESS
              value: "0.0.0.0:{{ .Values.service.targetPort }}"
            - name: XATA_SQL_GW_HEALTH_CHECK_PORT
              value: "8089"
            - name: XATA_SQL_GW_DRAINING_TIME
              value: {{ .Values.drainingTime | quote }}
            - name: GATEWAY_TARGET_PORT
              value: "5432"
            - name: OTEL_SERVICE_NAME
              value: "gateway"
            - name: XATA_SQL_GW_SSL_CERT_PATH
              value: "{{ .Values.secret.mountPath }}/tls.crt"
            - name: XATA_SQL_GW_SSL_KEY_PATH
              value: "{{ .Values.secret.mountPath }}/tls.key"
            - name: XATA_SQL_GW_CNPG_NAMESPACE
              value: {{ .Values.clustersNamespace | quote }}
            - name: CLUSTERS_GRPC_URL
              value: "clusters:5002"
            {{- if .Values.http.enabled }}
            - name: XATA_SQL_GW_HTTP_ENABLED
              value: "true"
            - name: XATA_SQL_GW_HTTP_LISTEN_ADDRESS
              value: "0.0.0.0:{{ .Values.service.httpTargetPort }}"
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: otel-config
          securityContext:
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: tls-cert
          secret:
            secretName: {{ .Values.secret.name }}
