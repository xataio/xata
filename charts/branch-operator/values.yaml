image:
  repository: ghcr.io/xataio/xata/branch-operator
  digest: ""
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

config:
  branchOperator:
    imageSecrets: ghcr-secret
    clustersTolerations: "xata.io/workload=dataplane:NoSchedule,kubernetes.io/arch=arm64:NoSchedule"
    cloudProvider: aws
    # ARN of the IAM role that pgBackRest uses for Branches with
    # s3.keyType=web-id. If you set it, each Cluster gets the web identity
    # token volume and the AWS_ROLE_ARN environment variable.
    pgbackrestWebIdentityRoleARN: ""
    # GKE Workload Identity pool (<project>.svc.id.goog). Enables
    # gcs.keyType=web-id for Branches.
    pgbackrestWorkloadIdentityPool: ""
    # Number of the GCP project that owns pgbackrestWorkloadIdentityPool.
    # Required for managed folder IAM policies.
    pgbackrestGCSProjectNumber: ""
    xatastor:
      enabled: true
    wakeupPasswordSyncTimeout: 5m
    # Worker counts for the operator's controllers
    branchMaxConcurrent: 1
    wakeupMaxConcurrent: 128
    gcsFolderMaxConcurrent: 4

resources:
  limits:
    cpu: 200m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 512Mi

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - branch-operator
          topologyKey: kubernetes.io/hostname

tolerations:
  - key: "kubernetes.io/arch"
    operator: "Equal"
    value: "arm64"
    effect: "NoSchedule"
