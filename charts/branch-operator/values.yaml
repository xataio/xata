image:
  repository: ghcr.io/xataio/xata/branch-operator
  digest: ""
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

config:
  branchOperator:
    imageSecrets: ghcr-secret
    clustersTolerations: "xata.io/workload=dataplane:NoSchedule,kubernetes.io/arch=arm64:NoSchedule"
    cloudProvider: aws
    # Shared IRSA role for pgBackRest backup and restore workloads.
    # Leave empty on GCP and S3-compatible storage that uses static keys.
    backupsAwsRoleArn: ""
    barmanRegionSecret:
      # Without this barman will create a role and bind it to our CNPG pods with
      # '*' permissions to all secrets in the namespace. This is a problem if
      # you get priv esc from postgres. Setting the region secret will scope the
      # role to just that secret and close the hole. With inheritFromIAMRole set
      # to true this has no actual implication since the AWS credential chain is
      # followed as normal and eventually fallback to IMDSv2 for credentials.
      name: barman-dummy-secret
      key: dummy
      value: dummy
    xatastor:
      enabled: true
    # Worker counts for the operator's controllers
    branchMaxConcurrent: 1
    wakeupMaxConcurrent: 16

resources:
  limits:
    cpu: 200m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 512Mi

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - branch-operator
          topologyKey: kubernetes.io/hostname

tolerations:
  - key: "kubernetes.io/arch"
    operator: "Equal"
    value: "arm64"
    effect: "NoSchedule"

extraConfig: {}

clustersNamespace: xata-clusters
crds:
  create: true

extraEnvFrom: []
