apiVersion: v1
kind: ConfigMap
metadata:
  name: branch-operator-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: branch-operator
data:
  XATA_IMAGE_SECRETS: {{ .Values.config.branchOperator.imageSecrets | quote }}
  XATA_CLUSTERS_TOLERATIONS: {{ .Values.config.branchOperator.clustersTolerations | quote }}
  XATA_CLOUD_PROVIDER: {{ .Values.config.branchOperator.cloudProvider | quote }}
  {{- with .Values.config.branchOperator.pgbackrestWebIdentityRoleARN }}
  XATA_PGBACKREST_S3_WEB_IDENTITY_ROLE_ARN: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.branchOperator.pgbackrestWebIdentityRestoreRoleARN }}
  XATA_PGBACKREST_S3_RESTORE_ROLE_ARN: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.branchOperator.pgbackrestWorkloadIdentityPool }}
  XATA_PGBACKREST_GCS_WORKLOAD_IDENTITY_POOL: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.branchOperator.pgbackrestGCSProjectNumber }}
  XATA_PGBACKREST_GCS_PROJECT_NUMBER: {{ . | quote }}
  {{- end }}
  XATA_XATASTOR_ENABLED: {{ .Values.config.branchOperator.xatastor.enabled | quote }}
  XATA_BRANCH_MAX_CONCURRENT: {{ .Values.config.branchOperator.branchMaxConcurrent | quote }}
  XATA_WAKEUP_MAX_CONCURRENT: {{ .Values.config.branchOperator.wakeupMaxConcurrent | quote }}
  XATA_GCS_FOLDER_MAX_CONCURRENT: {{ .Values.config.branchOperator.gcsFolderMaxConcurrent | quote }}
  XATA_WAKEUP_PASSWORD_SYNC_TIMEOUT: {{ .Values.config.branchOperator.wakeupPasswordSyncTimeout | quote }}
