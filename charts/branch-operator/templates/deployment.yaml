apiVersion: apps/v1
kind: Deployment
metadata:
  name: branch-operator
  namespace: {{ .Release.Namespace }}
  labels:
    app: branch-operator
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  selector:
    matchLabels:
      app: branch-operator
  template:
    metadata:
      annotations:
        checksum/chart-values: {{ toJson .Values | sha256sum }}
        {{- if (dig "rolloutOnUpgrade" false (.Values.global | default dict)) }}
        xata.io/helm-revision: {{ .Release.Revision | quote }}
        {{- end }}
      labels:
        app: branch-operator
    spec:
      serviceAccountName: branch-operator
      enableServiceLinks: false
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: branch-operator
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          env:
            - name: OTEL_SERVICE_NAME
              value: "branch-operator"
          envFrom:
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            - configMapRef:
                name: otel-config
            - configMapRef:
                name: branch-operator-config
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
