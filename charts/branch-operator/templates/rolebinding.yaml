apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: branch-operator
  namespace: {{ .Values.clustersNamespace }}
subjects:
  - kind: ServiceAccount
    name: branch-operator
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: branch-operator
  apiGroup: rbac.authorization.k8s.io
{{- if .Values.config.branchOperator.xatastor.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: branch-operator
  namespace: xatastor
subjects:
  - kind: ServiceAccount
    name: branch-operator
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: branch-operator
  apiGroup: rbac.authorization.k8s.io
{{- end }}
