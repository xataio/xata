apiVersion: batch/v1
kind: Job
metadata:
  name: import-keycloak-realm{{ if .Values.realmImport.revisionSuffix }}-{{ .Release.Revision }}{{ end }}
  namespace: {{ .Release.Namespace }}
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  ttlSecondsAfterFinished: {{ .Values.realmImport.ttlSecondsAfterFinished }}
  template:
    metadata:
      annotations:
        # Recreates the Job whenever realm.json or the keycloak-realm-config values it
        # substitutes change, so the import re-runs.
        xata.tech/realm-checksum: {{ list (.Files.Get "files/realm.json") .Values.config.realm | toJson | sha256sum }}
    spec:
      enableServiceLinks: false
      containers:
        - name: import
          image: {{ .Values.realmImport.image }}
          env:
            - name: KEYCLOAK_URL
              value: {{ .Values.realmImport.keycloakUrl | quote }}
            - name: KEYCLOAK_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.realmImport.keycloakUserSecret.name }}
                  key: {{ .Values.realmImport.keycloakUserSecret.key }}
            - name: KEYCLOAK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.realmImport.keycloakPasswordSecret.name }}
                  key: {{ .Values.realmImport.keycloakPasswordSecret.key }}
            - name: IMPORT_FILES_LOCATIONS
              value: /keycloak-realm/realm.json
            - name: IMPORT_VARSUBSTITUTION_ENABLED
              value: "true"
            # Wait for Keycloak to answer instead of failing pods while it starts.
            - name: KEYCLOAK_AVAILABILITYCHECK_ENABLED
              value: "true"
            - name: KEYCLOAK_AVAILABILITYCHECK_TIMEOUT
              value: "300s"
            # Organizations register their own identity provider through the SSO API, so the
            # realm holds providers this file has never heard of. keycloak-config-cli defaults
            # both of these to "full", which deletes anything absent from the import, and this
            # Job re-runs on every realm.json change.
            - name: IMPORT_MANAGED_IDENTITY_PROVIDER
              value: no-delete
            - name: IMPORT_MANAGED_IDENTITY_PROVIDER_MAPPER
              value: no-delete
            {{- with .Values.realmImport.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # add client secrets to the environment
          envFrom:
            - secretRef:
                name: keycloak-realm-secret
            - configMapRef:
                name: keycloak-realm-config
          volumeMounts:
            - name: keycloak-realm
              mountPath: /keycloak-realm
          resources:
            {{- toYaml .Values.realmImport.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.realmImport.securityContext | nindent 12 }}
      volumes:
        - name: keycloak-realm
          configMap:
            name: {{ .Values.realmImport.configMapName | default "keycloak-realm" }}
      restartPolicy: Never
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
