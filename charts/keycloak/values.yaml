image:
  repository: ghcr.io/xataio/xata/keycloak
  digest: ""
  tag: latest

instances: 2

update:
  strategy: Auto

hostname:
  hostname: ""
  strict: false
  admin: http://localhost:8080

db:
  vendor: postgres
  host: ""
  database: ""
  usernameSecret: {}
  # Rendered as KCRAW_DB_PASSWORD so Keycloak preserves $ characters.
  passwordSecret: {}

http:
  httpEnabled: true
  httpPort: 8080

gateway:
  envoyProxy:
    # The api-gateway chart owns this one; name another to give Keycloak a dedicated proxy.
    name: eg-custom-proxy-config
    # Renders the named EnvoyProxy here, for consumers that cannot share the api-gateway one.
    create: false
    spec: {}

features:
  enabled:
    - docker
    - authorization

resources:
  requests:
    cpu: 200m
    memory: 2Gi
  limits:
    cpu: 1
    memory: 2Gi

proxy:
  headers: xforwarded

additionalOptions:
  # Successful events log at DEBUG, so without this only failures reach the log pipeline.
  - name: spi-events-listener--jboss-logging--success-level
    value: "info"
  # Cluster gossip is 13% of the trace volume and says nothing about the flows we trace.
  - name: tracing-infinispan-enabled
    value: "false"

tracing:
  enabled: false

config:
  api:
    url: http://auth-keycloak-service:8080
    realm: xata
  realm:
    # Non-secret realm import variables. Each one set here takes precedence over
    # the same key in keycloak-realm-secret; left empty, the secret still applies.
    frontendRedirectURI: ""
    frontendAppRedirectURI: ""
    frontendWebOrigin: ""
    mcpResourceURL: ""
    smtp:
      host: "email-smtp.us-east-1.amazonaws.com"
      port: "2587"
      ssl: "false"
      from: "noreply@xata.io"
      replyTo: "support@xata.io"

realmImport:
  ttlSecondsAfterFinished: 86400
  image: adorsys/keycloak-config-cli:6.5.1-26.5.5
  # Name of a ConfigMap providing realm.json. When set, the chart does not
  # generate its own ConfigMap from files/realm.json.
  configMapName: ""
  keycloakUrl: http://auth-keycloak-service:8080
  keycloakUserSecret:
    name: auth-keycloak-initial-admin
    key: username
  keycloakPasswordSecret:
    name: auth-keycloak-initial-admin
    key: password
  env: []
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      cpu: 200m
      memory: 1Gi
  securityContext:
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000

tolerations:
  - key: "kubernetes.io/arch"
    operator: "Equal"
    value: "arm64"
    effect: "NoSchedule"

unsupported: {}

operator:
  enabled: true
