---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: branching-replica-operator
  namespace: xata-clusters
rules:
- apiGroups:
  - cnpg-extensions.yandex.cloud
  resources:
  - backupconfigs
  verbs:
  - create
  - get
  - list
  - update
  - watch
- apiGroups:
  - postgresql.cnpg.io
  resources:
  - clusters
  verbs:
  - create
  - get
  - list
  - patch
  - watch
- apiGroups:
  - xata.io
  resources:
  - branchingreplicas
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - xata.io
  resources:
  - branchingreplicas/status
  verbs:
  - get
  - patch
  - update
