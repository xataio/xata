image:
  repository: ghcr.io/xataio/xata/branching-replica-operator
  digest: ""
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

config:
  clustersNamespace: xata-clusters
  imageSecrets: ghcr-secret
  clustersTolerations: "xata.io/workload=dataplane:NoSchedule,kubernetes.io/arch=arm64:NoSchedule"

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 200m
    memory: 128Mi

tolerations:
  - key: "kubernetes.io/arch"
    operator: "Equal"
    value: "arm64"
    effect: "NoSchedule"
