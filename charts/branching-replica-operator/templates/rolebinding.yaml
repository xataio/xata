apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: branching-replica-operator
  namespace: {{ .Values.config.clustersNamespace }}
subjects:
  - kind: ServiceAccount
    name: branching-replica-operator
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: branching-replica-operator
  apiGroup: rbac.authorization.k8s.io
