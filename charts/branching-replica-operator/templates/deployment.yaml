apiVersion: apps/v1
kind: Deployment
metadata:
  name: branching-replica-operator
  namespace: {{ .Release.Namespace }}
  labels:
    app: branching-replica-operator
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  selector:
    matchLabels:
      app: branching-replica-operator
  template:
    metadata:
      labels:
        app: branching-replica-operator
    spec:
      serviceAccountName: branching-replica-operator
      enableServiceLinks: false
      containers:
        - name: branching-replica-operator
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          env:
            - name: OTEL_SERVICE_NAME
              value: "branching-replica-operator"
          envFrom:
            - configMapRef:
                name: otel-config
            - configMapRef:
                name: branching-replica-operator-config
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
