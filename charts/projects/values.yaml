image:
  repository: ghcr.io/xataio/xata/projects
  digest: ""
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  httpPort: 5001
  grpcPort: 5002

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 90

httpRoute:
  enabled: true
  hostname: localhost
  parentRef:
    name: eg
    namespace: ""
  pathPatterns:
    - "^/organizations/([^/]+)/projects(.*)"
    - "^/organizations/([^/]+)/limits"
    - "^/organizations/([^/]+)/regions"
    - "^/organizations/([^/]+)/instanceTypes"
    - "^/organizations/([^/]+)/credentials"
    - "^/organizations/([^/]+)/images"
    - "^/organizations/([^/]+)/extensions"
    - "^/organizations/([^/]+)/githubapp(.*)"
    - "^/webhooks/github"

postgres:
  host: postgres
  port: ""
  database: projects
  sslmode: disable
  existingSecret: ""
  userKey: username
  passwordKey: password
  bootstrap:
    enabled: false

metastoreReader:
  enabled: false
  existingSecret: ""
  userKey: metastore_reader_user
  passwordKey: metastore_reader_password

xataSecrets:
  enabled: false
  secretName: xata-secrets

dependencies:
  authGrpcUrl: "auth:5002"
  clustersGrpcUrl: "clusters:5002"

gateway:
  hostport: ""

# defaultRegion is the name of the default region to initialize on startup.
# If empty, no default region/cell is created.
defaultRegion: ""

observability:
  environment: local
  serviceName: projects
  otelConfigMap: otel-config

externalSecrets:
  projectsSecret: ""
  posthogSecret: posthog
  customerioSecret: ""

scheduler:
  default:
    type: Random

resources:
  limits:
    cpu: 200m
    memory: 200Mi
  requests:
    cpu: 100m
    memory: 200Mi

tolerations:
  - key: "kubernetes.io/arch"
    operator: "Equal"
    value: "arm64"
    effect: "NoSchedule"

nodeSelector: {}

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - projects
          topologyKey: kubernetes.io/hostname

podAnnotations:
  reloader.stakater.com/auto: "true"

podLabels: {}

cleanup:
  enabled: false
  schedule: "0 3 * * *"
  retentionDays: 90
  nodeSelector: {}
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 128Mi

# Serialize schema setup across replicas when using the standalone chart.
setupJob:
  enabled: false
  waitImage: alpine/k8s:1.34.1@sha256:ec714df3813b5405292860f8a1c55c5727bf8c33c88992f1e981efad8065547f
